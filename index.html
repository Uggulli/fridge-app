<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Что в холодильнике</title>

<!-- Telegram Mini Apps SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase (бесплатный уровень с лихвой хватает для семейного списка) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --bg: var(--tg-theme-bg-color, #F7F5F0);
    --surface: var(--tg-theme-secondary-bg-color, #FFFFFF);
    --ink: var(--tg-theme-text-color, #2B2B26);
    --ink-soft: var(--tg-theme-hint-color, #6B6A62);
    --line: #E4E1D8;
    --accent: var(--tg-theme-button-color, #C9A227);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --have: #4F7A5C;
    --out: #B8563F;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100%;
  }

  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 100px; }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .subtitle { color: var(--ink-soft); font-size: 13px; margin: 0 0 16px; }

  .stats { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
  .stat .num { font-size: 20px; font-weight: 700; line-height: 1; }
  .stat.have .num { color: var(--have); }
  .stat.out .num { color: var(--out); }
  .stat .label { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .add-row input {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 15px;
    color: var(--ink); outline: none; min-width: 0;
  }
  .add-row input#newItem { flex: 1; }
  .add-row input#newAmount { width: 72px; flex: 0 0 auto; }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 10px; padding: 0 16px;
    font-size: 15px; font-weight: 600; cursor: pointer; flex: 0 0 auto;
  }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  li.item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  li.item.have .dot { background: var(--have); }
  li.item.out .dot { background: var(--out); }

  li.item .name { flex: 1; font-size: 15px; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  li.item .name .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.item.out .name .title { color: var(--out); }
  li.item .name .amount { font-size: 12px; color: var(--ink-soft); flex-shrink: 0; opacity: 0.75; }

  li.item .del { background: none; border: none; color: var(--ink-soft); font-size: 20px; cursor: pointer; padding: 4px 6px; }

  .empty { text-align: center; color: var(--ink-soft); padding: 40px 20px; font-size: 14px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 20px; font-size: 13px;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Что в холодильнике</h1>
    <p class="subtitle">Общий список — правит любой из вас</p>

    <div class="stats">
      <div class="stat have"><div class="num" id="haveCount">0</div><div class="label">есть в наличии</div></div>
      <div class="stat out"><div class="num" id="outCount">0</div><div class="label">нужно купить</div></div>
    </div>

    <div class="add-row">
      <input type="text" id="newItem" placeholder="Добавить продукт…" autocomplete="off" />
      <input type="text" id="newAmount" placeholder="10 шт" autocomplete="off" />
      <button id="addBtn">+</button>
    </div>

    <div id="listContainer">
      <div class="empty" id="emptyState">Список пуст. Добавьте первый продукт.</div>
      <ul class="list" id="list"></ul>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ====== 1. ВСТАВЬТЕ СЮДА СВОЙ FIREBASE CONFIG ======
    // Получить: console.firebase.google.com -> ваш проект -> Project settings
    // -> вкладка "General" -> "Your apps" -> Web app -> firebaseConfig
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyBaOVIdySXDoZ7qy5gwmmrs1IziWMNs8yo",
      authDomain: "dzhfridge.firebaseapp.com",
      projectId: "dzhfridge",
      storageBucket: "dzhfridge.firebasestorage.app",
      messagingSenderId: "265015035857",
      appId: "1:265015035857:web:5d02b8a1ceedb50bc702f0"
    };
    // ====================================================

    // Telegram Mini App init
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();
    const itemsRef = db.collection('fridge_items');

    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('emptyState');
    const haveCountEl = document.getElementById('haveCount');
    const outCountEl = document.getElementById('outCount');
    const newItemInput = document.getElementById('newItem');
    const newAmountInput = document.getElementById('newAmount');
    const addBtn = document.getElementById('addBtn');
    const toastEl = document.getElementById('toast');

    let currentItems = [];

    function haptic(type) {
      if (tg && tg.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred('light');
      }
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function render(items) {
      currentItems = items;
      const sorted = items.slice().sort((a, b) => {
        if (a.status !== b.status) return a.status === 'out' ? -1 : 1;
        return (a.createdAt || 0) - (b.createdAt || 0);
      });

      if (sorted.length === 0) {
        emptyEl.style.display = 'block';
        listEl.innerHTML = '';
        haveCountEl.textContent = '0';
        outCountEl.textContent = '0';
        return;
      }
      emptyEl.style.display = 'none';

      haveCountEl.textContent = sorted.filter(i => i.status === 'have').length;
      outCountEl.textContent = sorted.filter(i => i.status === 'out').length;

      listEl.innerHTML = sorted.map(item => `
        <li class="item ${item.status}" data-id="${item.id}">
          <span class="dot" data-action="toggle" data-id="${item.id}"></span>
          <span class="name">
            <span class="title" data-action="toggle" data-id="${item.id}">${escapeHtml(item.name)}</span>
            <span class="amount" data-action="edit-amount" data-id="${item.id}">${item.amount ? escapeHtml(item.amount) : '+ кол-во'}</span>
          </span>
          <button class="del" data-action="delete" data-id="${item.id}">×</button>
        </li>
      `).join('');
    }

    listEl.addEventListener('click', async (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const id = target.dataset.id;
      const action = target.dataset.action;

      try {
        if (action === 'toggle') {
          const item = currentItems.find(i => i.id === id);
          if (!item) return;
          await itemsRef.doc(id).update({ status: item.status === 'have' ? 'out' : 'have' });
          haptic('light');
        } else if (action === 'delete') {
          await itemsRef.doc(id).delete();
          haptic('light');
        } else if (action === 'edit-amount') {
          const item = currentItems.find(i => i.id === id);
          const val = window.prompt('Количество (например «10 шт», «2 л»):', item && item.amount ? item.amount : '');
          if (val === null) return;
          await itemsRef.doc(id).update({ amount: val.trim() || null });
        }
      } catch (err) {
        showToast('Не удалось изменить');
      }
    });

    async function addItem() {
      const name = newItemInput.value.trim();
      const amount = newAmountInput.value.trim();
      if (!name) return;
      newItemInput.value = '';
      newAmountInput.value = '';
      try {
        await itemsRef.add({ name, amount: amount || null, status: 'have', createdAt: Date.now() });
        haptic('success');
      } catch (err) {
        showToast('Не удалось добавить');
      }
      newItemInput.focus();
    }

    addBtn.addEventListener('click', addItem);
    newItemInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') newAmountInput.focus(); });
    newAmountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    itemsRef.onSnapshot(
      (snap) => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render(items);
      },
      (err) => {
        showToast('Ошибка связи с базой');
        console.error(err);
      }
    );
  </script>
</body>
</html>
